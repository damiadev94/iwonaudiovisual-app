name: Sync Mercado Pago Subscriptions

on:
  schedule:
    # Cada 15 minutos. GitHub puede demorar hasta ~5 min extra en dispararlo.
    - cron: "*/15 * * * *"
  workflow_dispatch: # permite ejecutarlo manualmente desde GitHub Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Sync pending subscriptions
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/cron/sync-pending-subscriptions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Error: HTTP $HTTP_STATUS"
            exit 1
          fi
